<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Smiling Critters Asset Library (108 High-Res Pictures)</title>
  <style>
    :root {
      --bg: #120924;
      --card: #1f113c;
      --accent: #a855f7;
      --gold: #facc15;
      --text: #f8fafc;
      --muted: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #2e1065, #0f0720 70%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 24px 20px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      background: rgba(18, 9, 36, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    h1 { margin: 0 0 8px; font-size: 1.65rem; color: #fff; }
    .subtitle { margin: 0 0 14px; color: var(--muted); font-size: 0.95rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 1100px;
      margin: 0 auto;
    }
    .search-box {
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 0.95rem;
      min-width: 240px;
    }
    .pill {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      color: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .pill.active, .pill:hover {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border-color: #f472b6;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
      padding: 22px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
      border-color: var(--gold);
    }
    .thumb-wrap {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,0.04) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.04) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.04) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.04) 75%);
      background-size: 20px 20px;
      cursor: pointer;
    }
    .thumb-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .meta {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.25);
      color: #e9d5ff;
      width: fit-content;
    }
    .title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      word-break: break-word;
    }
    .dims {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn {
      flex: 1;
      text-align: center;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,0.12);
      border: none;
      cursor: pointer;
    }
    .btn.primary { background: #7c3aed; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(8, 4, 18, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      flex-direction: column;
      gap: 14px;
    }
    .modal.open { display: flex; }
    .modal img {
      max-width: 92vw;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 12px;
    }
  </style>
</head>

    const categories = ["All (" + ITEMS.length + ")", ...Array.from(new Set(ITEMS.map(x => x.character)))];
    let activeCat = categories[0];
    const filterBar = document.getElementById("filter-bar");
    const searchInput = document.getElementById("search-input");
    const grid = document.getElementById("gallery-grid");

    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "pill" + (cat === activeCat ? " active" : "");
      btn.textContent = cat;
      btn.onclick = () => {
        activeCat = cat;
        document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        render();
      };
      filterBar.appendChild(btn);
    });

    searchInput.addEventListener("input", render);

    function openLightbox(item) {
      document.getElementById("lightbox-img").src = item.filename;
      document.getElementById("lightbox-caption").textContent = `#${String(item.id).padStart(3,'0')} — ${item.title} (${item.width}×${item.height})`;
      const dl = document.getElementById("lightbox-dl");
      dl.href = item.filename;
      dl.download = item.filename.split("/").pop();
      document.getElementById("lightbox").classList.add("open");
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      grid.innerHTML = "";
      ITEMS.filter(item => {
        const matchCat = activeCat.startsWith("All ") || item.character === activeCat;
        const matchQ = !q || item.title.toLowerCase().includes(q) || item.character.toLowerCase().includes(q);
        return matchCat && matchQ;
      }).forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="thumb-wrap"><img loading="lazy" src="${item.filename}" alt="${item.title}" /></div>
          <div class="meta">
            <div>
              <span class="badge">${item.character}</span>
              <div class="title" style="margin-top:6px;">#${String(item.id).padStart(3,'0')} ${item.title}</div>
              <div class="dims">${item.width}×${item.height} • ${item.format}</div>
            </div>
            <div class="actions">
              <button class="btn primary view-btn">🔍 Zoom</button>
              <a class="btn" href="${item.filename}" download>⬇️ Save</a>
            </div>
          </div>
        `;
        card.querySelector(".thumb-wrap").onclick = () => openLightbox(item);
        card.querySelector(".view-btn").onclick = () => openLightbox(item);
        grid.appendChild(card);
      });
    }
    render();
  </script>
